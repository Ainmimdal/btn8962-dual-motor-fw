; Dual brushed DC motor driver firmware (STM32F103C8T6, BTN8962 x4)
;
; Build environments:
;   enc1_tim1            ENC1_CONFIG = ENC1_ON_TIM1      (default board rework, RS485 not fitted)
;   enc1_tim3_3v3        ENC1_CONFIG = ENC1_ON_TIM3_3V3  (encoder 1 powered from 3.3 V on PA6/PA7)
;   *_nocs               same, with USE_CURRENT_SENSE = 0
;
;   pio run -e enc1_tim1
;   pio run -e enc1_tim1 -t upload

[platformio]
default_envs = enc1_tim1

[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
board_build.f_cpu = 64000000L
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -Iinclude
    -Isrc
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wdouble-promotion
build_src_filter = +<*>

[env:enc1_tim1]
build_flags =
    ${env.build_flags}
    -DENC1_CONFIG=ENC1_ON_TIM1
    -DUSE_CURRENT_SENSE=1

[env:enc1_tim3_3v3]
build_flags =
    ${env.build_flags}
    -DENC1_CONFIG=ENC1_ON_TIM3_3V3
    -DUSE_CURRENT_SENSE=1

[env:enc1_tim1_nocs]
build_flags =
    ${env.build_flags}
    -DENC1_CONFIG=ENC1_ON_TIM1
    -DUSE_CURRENT_SENSE=0

[env:enc1_tim3_3v3_nocs]
build_flags =
    ${env.build_flags}
    -DENC1_CONFIG=ENC1_ON_TIM3_3V3
    -DUSE_CURRENT_SENSE=0
